<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>geometry-calculation</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>
    <header>

    </header>

    <main>
        <!-- main containt container -->
        <div class="flex flex-col md:flex-row justify-around ">
            <!-- shape card container -->
            <div class="flex grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3">

                <!-- triangle card -->
                <div class="card bg-base-100 w-96 shadow-xl">
                    <figure>
                        <img src="images/triangle.png" alt="triangle" />
                    </figure>
                    <div class="card-body">
                        <h2 class="card-title mx-auto text-3xl">triangle</h2>
                        <p class="text-center font-3xl">Area = 0.5 x b x h</p>

                        <div class="flex">
                            <input id="tariangle-input" class="w-24 text-2xl p-1 rounded-sm" type="text"
                                placeholder="b">
                            <span class="m-auto text-2xl">cm</span>
                            <input id="height-input" class="w-24 text-2xl p-1 rounded-sm" type="text" placeholder="h">
                            <span class="m-auto text-2xl">cm</span>
                        </div>
                        <div>
                            <p class="text-2xl">Area : <span id="triangle-area"></span> <span>cm<sup>2</sup> </span></p>
                        </div>
                        <div class="card-actions justify-end">
                            <button onclick="CalculatetriangleArea()"
                                class="btn btn-primary w-full">calculation</button>
                        </div>
                    </div>
                </div>


                <!-- 2nd  -->
                <div>
                    <!-- Rectangle card -->

                    <div class="card bg-base-100 w-96 shadow-xl">
                        <figure>
                            <img src="images/rectangle.png" alt="triangle" />
                        </figure>
                        <div class="card-body">
                            <h2 class="card-title mx-auto font-medium">Rectangle</h2>
                            <p class="text-3xl text-center">Area (A) = w x I</p>

                            <!-- get input box -->
                            <div class="flex">
                                <input id="rectangle-len" class="w-24 text-2xl p-1 rounded-sm" type="text"
                                    placeholder="length"> <span class="m-auto">cm</span>
                                <input id="rectangle-wid" class="w-24 text-2xl p-1 rounded-sm" type="text"
                                    placeholder="width"> <span class="m-auto">cm</span>
                            </div>

                            <div>
                                <p> Area: <span id="rectangle-span">0</span> <span>cm<sub>2</sub></span> </p>
                            </div>

                            <div class="card-actions justify-end">
                                <button onclick="CalculaterectangleArea()"
                                    class="btn btn-primary w-full text-white">Calculate</button>
                            </div>
                        </div>
                    </div>
                </div>


                <!-- 3rd  -->

                <div>
                    <!-- Parallelogram card -->
                    <div class="card bg-base-100 w-96 shadow-xl">
                        <figure>
                            <img src="images/parallelogram.png" alt="parallelogram" />
                        </figure>
                        <div class="card-body">
                            <h2 class="card-title mx-auto">Parallelogram</h2>
                            <p class="text-3xl text-center">Area (A) = b x h</p>
                            <div flex>
                                <input id="Parallelogram-b" class="w-24 p-1 text-2xl rounded-sm " type="text"
                                    placeholder="b"> <span class="m-auto">cm</span>
                                <input id="Parallelogram-wid" class="w-24 p-1 text-2xl rounded-sm " type="text"
                                    placeholder="h"> <span class="m-auto">cm </span>



                            </div>

                            <div class="card-actions justify-end">
                                <button onclick="calculateParallelogramArea()"
                                    class="btn btn-primary w-full">Calculate</button>
                            </div>
                        </div>
                    </div>
                </div>



                <!-- 4th -->
                <div>
                    <!-- triangle card -->
                    <div class="card bg-base-100 w-96 shadow-xl">
                        <figure>
                            <img src="images/triangle.png" alt="triangle" />
                        </figure>
                        <div class="card-body">
                            <h2 class="card-title">Card Title</h2>
                            <p>A card component has a figure, a body part, and inside body there are title and actions
                                parts
                            </p>
                            <div class="card-actions justify-end">
                                <button class="btn btn-primary">Buy Now</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>


            <!-- area calculation container -->
            <div class="w-96 w-96 border-2 border-red-500">
                <h3 class="text-3xl">Area calculation</h3>

            </div>
        </div>
    </main>


    <script src="script/script.js"></script>
    <script src="script/rectangle.js"></script>
    <script src="script/parallelogram.js"></script>
</body>

</html>
